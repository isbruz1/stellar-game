<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Game - Écran de Démarrage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Écran de démarrage / Accueil -->
    <div id="splash-screen" class="splash-container">
        
        <!-- Icône du jeu en grand avec animation -->
        <div class="logo-wrapper">
            <img src="assets/stellar.png" alt="Stellar Game Logo" id="splash-logo">
            <div class="logo-glow"></div>
        </div>

        <h1 class="game-title">STELLAR GAME</h1>
        <p class="game-subtitle">Préparez vos canons, le combat spatial commence</p>

        <!-- Menu principal -->
        <div class="menu-box">
            <button id="start-btn" class="menu-btn primary">🎮 Jouer / Salon</button>
            <button id="settings-btn" class="menu-btn secondary">⚙️ Paramètres <span class="badge-soon">(Bientôt)</span></button>
        </div>

        <!-- Indicateur de statut de connexion au serveur -->
        <div id="server-status" class="status-offline">
            <span class="status-dot"></span> 
            <span id="status-text">Connexion au serveur...</span>
        </div>

    </div>

    <!-- Socket.io et script principal -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
