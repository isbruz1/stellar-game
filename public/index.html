<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOBBY ============ -->
<div id="lobbyScreen" class="screen">
  <div class="top-bar">
    <div class="logo">✦ STELLAR GAME</div>
    <button id="settingsBtn" class="icon-btn" title="Paramètres">⚙️</button>
  </div>

  <div class="lobby-content">
    <h2>Salon <span id="playerCount">(0)</span></h2>
    <div class="players-grid" id="playersGrid"></div>
  </div>

  <div class="bottom-bar">
    <button id="quitBtn" class="btn btn-red hidden">QUITTER LE SERVEUR</button>
    <button id="actionBtn" class="btn btn-green" disabled>...</button>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="gameScreen" class="screen hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <button id="leaveGameBtn" class="icon-btn" title="Retour au salon">←</button>
    <div id="scoreboard"></div>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Paramètres</h2>
    <label>Pseudo</label>
    <input id="pseudoInput" type="text" maxlength="16" placeholder="Ton pseudo">
    <label>Skin</label>
    <div id="skinPicker" class="skins-row"></div>
    <button id="closeSettings" class="btn btn-green">FERMER</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="skins.js"></script>
<script src="game.js"></script>
</body>
</html>
