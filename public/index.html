<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Game - Salon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lobby-screen" class="screen">
        <img src="assets/stellar.png" alt="Logo Stellar Game" id="game-logo">
        <h1>✨ STELLAR GAME ✨</h1>
        <div class="login-box">
            <input type="text" id="username-input" placeholder="Entre ton pseudo..." maxlength="15">
            <button id="join-btn" class="btn">Rejoindre le salon</button>
        </div>

        <div id="room-container" style="display: none;">
            <h3>Joueurs dans le salon</h3>
            <ul id="players-list"></ul>
            <button id="ready-btn" class="btn not-ready">Je ne suis pas prêt</button>
            <p id="waiting-msg">En attente que tout le monde soit prêt...</p>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
