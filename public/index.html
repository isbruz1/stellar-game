<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== SPLASH ==================== -->
<div id="splashScreen" class="screen splash-screen">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-content">
    <img src="assets/stellar.png" alt="Stellar Game" class="splash-logo">
    <div class="splash-tagline">PRÉPARATION DU DÉCOLLAGE…</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
  </div>
</div>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen" class="screen login-screen hidden">
  <div class="stars"></div>
  <div class="login-box">
    <img src="assets/stellar.png" alt="Stellar Game" class="login-logo">

    <h1>CRÉE TON PROFIL</h1>
    <p class="login-sub">Rejoins le salon principal</p>

    <label for="pseudoInput">Pseudo</label>
    <input id="pseudoInput" type="text" maxlength="16"
           placeholder="5 caractères minimum" autocomplete="off" spellcheck="false">
    <div id="pseudoError" class="error-msg"></div>

    <label for="realNameInput">Nom réel</label>
    <input id="realNameInput" type="text" maxlength="32"
           placeholder="Ton nom" autocomplete="off" spellcheck="false">

    <button id="loginBtn" class="btn btn-green" disabled>DÉCOLLER 🚀</button>
  </div>
</div>

<!-- ==================== LOBBY ==================== -->
<div id="lobbyScreen" class="screen hidden">
  <div class="top-bar">
    <div class="logo">
      <img src="assets/stellar.png" class="logo-img">
      <span>STELLAR GAME</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Paramètres">⚙️</button>
  </div>

  <div class="lobby-content">
    <h2>SALON PRINCIPAL <span id="playerCount">(0)</span></h2>
    <div class="players-grid" id="playersGrid"></div>
  </div>

  <div class="bottom-bar">
    <button id="quitBtn" class="btn btn-red hidden">QUITTER LE SERVEUR</button>
    <button id="actionBtn" class="btn btn-green" disabled>...</button>
  </div>
</div>

<!-- ==================== GAME ==================== -->
<div id="gameScreen" class="screen hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <button id="leaveGameBtn" class="icon-btn" title="Retour au salon">←</button>
    <div id="scoreboard"></div>
  </div>
</div>

<!-- ==================== SETTINGS ==================== -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Paramètres</h2>

    <label>Pseudo</label>
    <input id="settingsPseudo" type="text" maxlength="16">

    <label>Nom réel</label>
    <input id="settingsRealName" type="text" maxlength="32">

    <label>Skin</label>
    <div id="skinPicker" class="skins-row"></div>

    <button id="closeSettings" class="btn btn-green">FERMER</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="skins.js"></script>
<script src="game.js"></script>
</body>
</html>
