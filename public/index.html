<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Game - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cinématique d'introduction -->
    <div id="intro-overlay" class="intro-overlay">
        <div class="intro-content">
            <img src="assets/stellar.png" alt="Stellar Game Logo" id="intro-logo">
            <h2 id="typed-welcome-text"></h2>
        </div>
    </div>

    <!-- Écran de verrouillage / Saisie du pseudo -->
    <div id="login-screen" class="login-container" style="display: none; opacity: 0;">
        <div class="login-box">
            <img src="assets/stellar.png" alt="Logo" class="login-logo">
            <h2>Bienvenue pilote !</h2>
            <p>Entre ton pseudo pour entrer dans la zone de combat</p>
            
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Ton pseudo..." maxlength="15" autocomplete="off">
                <button id="validate-btn" class="menu-btn primary">Valider ➔</button>
            </div>
        </div>
    </div>

    <!-- Message de salutation animé après validation du pseudo -->
    <div id="welcome-message-overlay" class="welcome-overlay" style="display: none;">
        <h1 id="animated-greeting"></h1>
    </div>

    <!-- Écran de démarrage / Menu Principal -->
    <div id="splash-screen" class="splash-container" style="display: none; opacity: 0;">
        
        <div class="logo-wrapper">
            <img src="assets/stellar.png" alt="Stellar Game Logo" id="splash-logo">
            <div class="logo-glow"></div>
        </div>

        <h1 class="game-title">STELLAR GAME</h1>
        <p class="game-subtitle">Préparez vos canons, le combat spatial commence</p>

        <div class="menu-box">
            <button id="start-btn" class="menu-btn primary">🎮 Jouer / Salon</button>
            <button id="settings-btn" class="menu-btn secondary">⚙️ Paramètres <span class="badge-soon">(Bientôt)</span></button>
        </div>

        <div id="server-status" class="status-offline">
            <span class="status-dot"></span> 
            <span id="status-text">Connexion au serveur...</span>
        </div>

    </div>

    <!-- Écran de Jeu (Canvas plein écran) -->
    <div id="game-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Socket.io et script principal -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
